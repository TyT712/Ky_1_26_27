<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Hub LMS - Cổng Học Liệu Tương Tác Đại Học</title>
  <meta name="description" content="Ứng dụng học tập tương tác: lý thuyết chuẩn hóa, ngân hàng 30 câu trắc nghiệm/chương, câu hỏi ngắn và bài tập tự luận các môn: Hệ Quản trị CSDL, Chủ nghĩa Xã hội Khoa học.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">

  <!-- Chống nhấp nháy theme: áp dụng theme trước khi vẽ giao diện -->
  <script>
    (function () {
      var t = localStorage.getItem('semesterhub.theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main" class="skip-link">Bỏ qua điều hướng</a>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" id="brand-link" aria-label="Về trang chủ">
        <span class="brand-mark">S</span>
        <span class="brand-text"><strong>Semester Hub</strong><small>Learning Management System</small></span>
      </a>
      <nav class="header-actions" aria-label="Điều hướng chính">
        <a href="#/" class="nav-link" id="nav-home">Môn học</a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Chuyển giao diện Sáng/Tối" title="Chuyển giao diện Sáng/Tối">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="container main-area" tabindex="-1">
    <div id="app" aria-live="polite">
      <div class="loading"><span class="spinner"></span> Đang tải học liệu...</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Semester Hub LMS · Dữ liệu bám sát giáo trình · Tiến độ được lưu trên trình duyệt của bạn (localStorage)</div>
  </footer>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-body"></form>
  </dialog>

  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script defer src="assets/js/app.js"></script>
</body>
</html>
